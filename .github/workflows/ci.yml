name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Model Loading and Inference
      run: |
        python -c "import joblib, numpy as np; model = joblib.load('credit_fraud.pkl'); sample = np.array([[1, 1, 1000.0, 5000.0, 4000.0, 0.0, 1000.0, 0.0]]); pred = model.predict(sample); print('Model check passed, prediction:', pred)"
